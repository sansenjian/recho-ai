services:
  # ── 后端 API 网关 ──
  - type: web
    name: recho-gateway
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_BASE_URL
        value: https://api.moonshot.cn/v1
      - key: TAVILY_API_KEY
        sync: false
      - key: IMAGE_GEN_API_KEY
        sync: false
      - key: IMAGE_GEN_BASE_URL
        value: https://lucen.plus/v1
      - key: PROVIDER_API_KEY_MASTER_KEY
        sync: false
      - key: IMAGE_CREDIT_COST_PER_IMAGE
        value: 1
      - key: IMAGE_RESPONSES_IMAGE_MODEL
        value: gpt-image-2
      - key: APP_ENV
        value: production
      - key: GO_GATEWAY_BASE_URL
        value: http://127.0.0.1:3001
      - key: GO_GATEWAY_PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_IMAGE_BUCKET
        value: recho-images
      - key: ADMIN_USER_IDS
        sync: false
      - key: ADMIN_USER_EMAILS
        sync: false
      - key: CORS_ORIGIN
        # Vercel 给每次预览/部署分配全新主机名，无法逐一枚举，因此最后一条用 re: 正则
        # 只放行本 team 下 recho-* 的项目（正则语法见 backend/gateway/src/cors-origin.ts）。
        value: 'https://recho-ai.onrender.com,https://recho.sansenjian.asia,https://recho-ai.vercel.app,http://localhost:5173,http://localhost:5174,re:^https://recho-[a-z0-9-]+-sansenjians-projects\.vercel\.app$'

  # ── 前端静态站点 ──
  - type: web
    name: recho-ai
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://recho-gateway.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /favicon.svg
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /icons.svg
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
