name: CI

# 这个 workflow 的存在理由：仓库既有的三个 workflow（contracts / image-libvips /
# supabase-migrations）都是「路径受限的专项检查」，没有任何一个跑全量测试、lint、
# 前端类型检查或前端构建。结果是 `src/**` 的改动不触发任何 CI，而改了
# backend/gateway/** 的 PR 虽然会跑 contracts，却只执行 3 个契约测试文件
# （`npm run test:contracts`）——测试套件里其余 53 个文件在 PR 阶段完全没有覆盖。
#
# 所以这里**故意不设 paths 过滤**：宁可让文档改动的 PR 也付一次 CI 时间，
# 也不要再出现「CI 全绿但改动其实从未被测过」的情况。

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # 必须 >= 24.15：npm 生态的 nopt@10 / abbrev@5 /
          # validate-npm-package-name@8 声明 engines 为
          # `^22.22.2 || ^24.15.0 || >=26.0.0`，24.13 会报 EBADENGINE。
          # 选 24 而非 22 的真正原因：npm 10.9.7 在本仓库 lockfile 上
          # 无法求解依赖图（arborist `reading 'edgesOut'` 崩溃），
          # 而依赖更新必须能求解 ⇒ 必须用自带 npm 11 的 node。
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/gateway/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Node Gateway dependencies
        run: npm ci --prefix backend/gateway

      # 先跑 lint：最快、最容易失败的检查放最前面，反馈时间最短。
      - name: Lint
        run: npm run lint

      # `npm run build` = `vue-tsc -b && vite build`
      # 这一步同时覆盖前端类型检查与生产构建——两者此前都只在 Render 部署时
      # （即 push 到 master 之后）才被执行，PR 阶段完全没有保护。
      - name: Type-check and build frontend
        run: npm run build

      # 全量测试套件（含契约测试，因此与 contracts.yml 有重叠——重叠无害）。
      # 注意：若干测试文件靠文件首行的 `// @vitest-environment jsdom` 单独立环境，
      # 缺少该标注会立刻因 localStorage / window 未定义而失败，不会静默降级。
      - name: Run the full test suite
        run: npm test
